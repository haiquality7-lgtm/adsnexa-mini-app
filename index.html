mplate-columns:repeat(5,1fr);padding:8px}.nav button{background:none;border:0;color:#7892ac;font-size:10px}.nav i{display:block;font-style:normal;font-size:18px}.item{display:flex;justify-content:space-between;border-bottom:1px solid #1b3450;padding:12px 0}.toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:#17304a;padding:11px;border-radius:10px;display:none;font-size:12px}

<div class="card">
<h2>👥 Referral Center</h2>
<div class="level-card">

  <b id="levelText">0 / 3 referrals to reach Elite</b>
  <div class="progress"><i id="levelProgress"></i></div>
  <div class="muted">Levels: Common → Elite → Pro → Master → Legendary</div>
</div>

</div>

</div>

    <div class="level-title" id="profileLevelTitle">⭐ Common · Level 1</div>
    <div class="level-sub" id="profileLevelSub">Build your referral network to unlock higher rewards</div>
  </div>
  <div class="level-grid" id="profileLevelGrid">

    <div class="level-mini">💎<b>Master</b><small>12+</small></div>

</div>

</div>
<div class="daily-card">
  <div class="daily-head"><div><b>🎬 Daily Ads</b><div class="muted">Core daily target</div></div><div class="daily-number"><span id="dailyAds">0</span>/30</div></div>
  <div class="daily-progress"><i id="dailyProgress"></i></div>
  <div class="reward-boxes">
    <div class="reward-box"><div class="icon">🎯</div><b>30 Daily</b><span class="muted">Core ads</span></div>
    <div class="reward-box"><div class="icon">⚡</div><b>30 Extra</b><span class="muted">Extra slots</span></div>
    <div class="reward-box"><div class="icon">🎁</div><b>10 Bonus</b><span class="muted">Bonus items</span></div>
  </div>

  <h3>Profile Overview</h3>
  <div class="item"><span>Telegram ID</span><b id="profileId">—</b></div>

  <div class="item"><span>Total Referrals</span><b id="profileRefs">0</b></div>
  <div class="item"><span>Referral Earnings</span><b>$0.00</b></div>

</div>
</div>
<div id="levelUpModal" class="level-toast">
  <div class="level-toast-card">
    <div class="big" id="levelUpIcon">🎉</div>
    <h2 id="levelUpTitle">Level Up!</h2>

  </div>
</div>
<div class="nav"><button onclick="page('home')"><i>🏠</i>Home</button><button onclick="page('watch')"><i>🎬</i>Ads</button><button onclick="page('ref')"><i>👥</i>Referrals</button><button onclick="page('history')"><i>📜</i>History</button><button onclick="page('profile')"><i>👤</i>Profile</button></div><div id="toast" class="toast"></div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}
const W={ton:"UQD2KsEcAoJc8ksG53JOXM5ZZ0YqLCVCDJ_3VyykrAYOyJGz",btc:"bc1q0cpwxwwz75es7y6970mn7khamzxudvdfp0y3ge",bsc:"YOUR_BSC_USDT_WALLET_ADDRESS",tron:"YOUR_TRON_USDT_WALLET_ADDRESS"};
const N={ton:"TON Network",btc:"Bitcoin Network",bsc:"BNB Smart Chain",tron:"TRON (TRC-20)"};
const AD_REWARD_PER_100 = {
  1: 0.02, // Common
  2: 0.03, // Elite
  3: 0.04, // Pro
  4: 0.05, // Master
  5: 0.07  // Legendary
};
const REFERRAL_LEVELS = [
  {level:1,name:"Common",min:0},
  {level:2,name:"Elite",min:3},
  {level:3,name:"Pro",min:6},
  {level:4,name:"Master",min:12},
  {level:5,name:"Legendary",min:15}
];
function getReferralLevel(referrals){
  let current=REFERRAL_LEVELS[0];
  for(const x of REFERRAL_LEVELS){ if(referrals>=x.min) current=x; }
  return current;
}
function getAdRewardPer100(referrals){
  return AD_REWARD_PER_100[getReferralLevel(referrals).level];
}
function updateAdRewardUI(referrals){
  const lvl=getReferralLevel(referrals);
  const rate=getAdRewardPer100(referrals);
  const txt="$"+rate.toFixed(2)+" per 100 ads";
  const el=document.getElementById("watchRate");
  if(el) el.textContent=txt;
  const badge=document.getElementById("levelBadge");
  if(badge) badge.textContent="⭐ "+lvl.name+" · Level "+lvl.level;
  const p=document.getElementById("profileLevel");
  if(p) p.textContent="⭐ "+lvl.name+" · Level "+lvl.level;
}

function getReferralCount(){
  return +(localStorage.getItem("adsnexa_referrals")||0);
}
function getAdsCount(){
  return +(localStorage.getItem("adsnexa_ads")||0);
}
function updateEnhancedLevelUI(referrals, showAnimation){
  const lvl=getReferralLevel(referrals), rate=getAdRewardPer100(referrals);
  const old=+(localStorage.getItem("adsnexa_last_level")||1);
  const badge=document.getElementById("levelBadge"); if(badge) badge.textContent=lvl.icon+" "+lvl.name+" · Level "+lvl.level;
  const p=document.getElementById("profileLevel"); if(p) p.textContent=lvl.icon+" "+lvl.name+" · Level "+lvl.level;
  const title=document.getElementById("profileLevelTitle"); if(title) title.textContent=lvl.icon+" "+lvl.name+" · Level "+lvl.level;
  const sub=document.getElementById("profileLevelSub");
  if(sub){
    const next=REFERRAL_LEVELS.find(x=>x.level===lvl.level+1);
    sub.textContent=next ? (next.min-referrals)+" more referral(s) to reach "+next.name : "Maximum referral level unlocked";
  }
  const ring=document.getElementById("profileRing"); if(ring) ring.className="level-ring lv"+lvl.level;
  const rateEl=document.getElementById("profileAdRate"); if(rateEl) rateEl.textContent="$"+rate.toFixed(2)+" / 100 ads";
  document.querySelectorAll("#profileLevelGrid .level-mini").forEach((el,i)=>{
    el.classList.toggle("active",i===lvl.level-1);
    el.classList.toggle("locked",i>lvl.level-1);
  });
  const u=tg?.initDataUnsafe?.user, name=u?.first_name||u?.username||"Telegram User";
  const letter=document.getElementById("profileAvatarLetter");
  if(letter) letter.innerHTML=u?.photo_url
    ? '<img src="'+u.photo_url+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">'
    : name.charAt(0).toUpperCase();
  if(showAnimation && lvl.level>old) showLevelUp(lvl);
  localStorage.setItem("adsnexa_last_level",String(lvl.level));
}
function showLevelUp(lvl){
  document.getElementById("levelUpIcon").textContent=lvl.icon;
  document.getElementById("levelUpTitle").textContent="Level Up! "+lvl.name;
  document.getElementById("levelUpText").textContent="You reached "+lvl.name+" · Level "+lvl.level+". Your reward is now $"+AD_REWARD_PER_100[lvl.level].toFixed(2)+" per 100 completed ads.";
  document.getElementById("levelUpModal").classList.add("show");
}
function closeLevelUp(){document.getElementById("levelUpModal").classList.remove("show")}
function updateDailyAdUI(){
  const ads=getAdsCount(), daily=Math.min(30,ads%31), total=Math.min(100,ads%101);
  const d=document.getElementById("dailyAds"), p=document.getElementById("dailyProgress");
  if(d)d.textContent=daily; if(p)p.style.width=(daily/30*100)+"%";
  const wd=document.getElementById("watchDailyCount"), wp=document.getElementById("watchDailyProgress");
  if(wd)wd.textContent=total; if(wp)wp.style.width=(total/100*100)+"%";
  const home=document.getElementById("ads"); if(home)home.textContent=ads;
}

function page(id){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");if(id=="deposit")wallet();if(id=="profile")profile();scrollTo(0,0)}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",2600)}
function amt(x){amount.value=x}
function wallet(){let k=net.value;w.innerHTML='<div class="notice">💳 <b>'+N[k]+'</b></div><div class="wallet">'+W[k]+'</div><button class="btn alt" onclick="navigator.clipboard?.writeText(W[net.value]);toast('Wallet address copied.')">Copy Address</button>'}
function tx(){let a=+amount.value;if(a<1||a>100){toast("Deposit must be between $1 and $100.");return}page("tx")}
function submitTx(){if(!txid.value.trim()){toast("Please enter the Transaction ID / Hash.");return}let h=JSON.parse(localStorage.getItem("adsnexa_history")||"[]");h.push({amount:+amount.value,method:N[net.value],tx:txid.value.trim(),status:"Pending Verification",date:new Date().toLocaleString()});localStorage.setItem("adsnexa_history",JSON.stringify(h));render();toast("Deposit submitted. Please wait a few minutes for verification.");setTimeout(()=>page("history"),500)}
function render(){let h=JSON.parse(localStorage.getItem("adsnexa_history")||"[]");hist.innerHTML=h.length?h.slice().reverse().map(x=>'<div class="item"><span><b>$'+x.amount.toFixed(2)+'</b><br><span class="muted">'+x.method+' · '+x.date+'</span></span><span>⏳ '+x.status+'</span></div>').join(""):"No transactions yet."}
function profile(){
 const u=tg?.initDataUnsafe?.user;
 const name=u?.first_name||u?.username||"Telegram User";
 const username=u?.username?("@"+u.username):"No public username";
 document.getElementById("profileName").textContent=name;
 document.getElementById("profileUsername").textContent=username;
 document.getElementById("profileId").textContent=u?.id||"—";
 document.getElementById("profileBalance").textContent="$0.00";
 document.getElementById("rl").value="https://t.me/AdsNexa_EarnBot?start="+(u?.id||"USER_ID");
 const photo=document.getElementById("profilePhoto");
 if(u?.photo_url){photo.src=u.photo_url;photo.style.display="block";document.getElementById("avatar").innerHTML='<img src="'+u.photo_url+'" style="width:100%;height:100%;object-fit:cover">'}
 else {photo.style.display="none"}
 updateReferralUI(0);
updateAdRewardUI(0);
 renderReferralList();
updateReferralUI(0);
}
render();profile();wallet();updateReferralUI(getReferralCount());updateEnhancedLevelUI(getReferralCount(),false);updateDailyAdUI();renderReferralList();
updateReferralUI(0);
</script></body></html>
