<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdsNexa</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font:15px system-ui}.app{max-width:520px;margin:auto;padding:18px 15px 90px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:800}.brand b{color:#5b8cff}.avatar{width:42px;height:42px;border-radius:50%;background:#18304c;display:grid;place-items:center}.card,.stat{background:#0d1b2e;border:1px solid #1b3450;border-radius:18px;padding:16px;margin:12px 0}.balance{background:linear-gradient(135deg,#183b72,#152640);border-radius:22px;padding:20px;margin:18px 0}.money{font-size:34px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:#91a7bf;font-size:12px}.btn{border:0;border-radius:12px;padding:13px;background:#5b8cff;color:white;font-weight:700;width:100%;margin-top:9px}.alt{background:#18314c}.green{background:#159b77}.row{display:flex;gap:9px}.row .btn{flex:1}.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.menu button{background:#0d1b2e;border:1px solid #1b3450;color:white;border-radius:13px;padding:10px 4px}.menu span{display:block;font-size:20px;margin-bottom:4px}label{font-size:12px;color:#9db2c9}input,select{width:100%;padding:13px;background:#091827;border:1px solid #28435f;border-radius:12px;color:#fff;margin:7px 0 12px}.amounts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.amounts button{background:#0b1929;color:white;border:1px solid #28435f;border-radius:10px;padding:10px}.wallet{word-break:break-all;background:#091827;border:1px dashed #36577a;border-radius:12px;padding:12px;font-size:12px}.notice{background:#10243b;border-radius:12px;padding:12px;color:#b9cbe0;font-size:12px;line-height:1.5;margin:10px 0}.page{display:none}.page.active{display:block}.back{background:none;border:0;color:#9db6d2;padding:0;margin-bottom:10px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#081522ee;border-top:1px solid #1b3450;display:grid;grid-template-columns:repeat(5,1fr);padding:8px}.nav button{background:none;border:0;color:#7892ac;font-size:10px}.nav i{display:block;font-style:normal;font-size:18px}.item{display:flex;justify-content:space-between;border-bottom:1px solid #1b3450;padding:12px 0}.toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:#17304a;padding:11px;border-radius:10px;display:none;font-size:12px}

.level-card{background:linear-gradient(135deg,#132c49,#0d1b2e);border:1px solid #31577e;border-radius:17px;padding:16px;margin:12px 0}
.level-badge{display:inline-flex;align-items:center;gap:7px;background:#183b72;border-radius:999px;padding:7px 11px;font-weight:800;font-size:12px}

</head><body><div class="app">

<div class="card"><h3>Quick Actions</h3><div class="menu"><button onclick="page('watch')"><span>🎬</span>Watch Ads</button><button onclick="page('ref')"><span>👥</span>Referrals</button><button onclick="page('promote')"><span>📢</span>Promote</button><button onclick="page('wheel')"><span>🎡</span>Lucky Wheel</button><button onclick="page('deposit')"><span>💰</span>Deposit</button><button onclick="page('withdraw')"><span>💸</span>Withdraw</button><button onclick="page('history')"><span>📜</span>History</button><button onclick="page('promo')"><span>🎟️</span>Promo Code</button></div></div></div>

<div class="card"><h2>🎬 Watch Ads & Earn</h2>

Your reward increases automatically as your referral level increases.</div>

<div class="item"><span>⭐ Level 1 · Common</span><b>$0.02</b></div>

<div id="deposit" class="page"><button class="back" onclick="page('home')">← Back</button><div class="card"><h2>💰 Deposit</h2><div class="notice">Minimum Deposit: <b>$1.00</b><br>Maximum Deposit: <b>$100.00</b></div><label>Amount (USD)</label><div class="amounts"><button onclick="amt(1)">$1</button><button onclick="amt(5)">$5</button><button onclick="amt(10)">$10</button><button onclick="amt(25)">$25</button><button onclick="amt(50)">$50</button><button onclick="amt(75)">$75</button><button onclick="amt(100)">$100</button></div><input id="amount" type="number" min="1" max="100" value="1"><label>Payment Method</label><select id="net" onchange="wallet()"><option value="ton">🔵 TON — TON Network</option><option value="btc">🟠 Bitcoin — BTC Network</option><option value="bsc">🟡 USDT — BNB Smart Chain</option><option value="tron">🟢 USDT — TRON (TRC-20)</option></select><div id="w"></div><button class="btn" onclick="tx()">Continue to Transaction ID</button></div></div>

<div id="tx" class="page"><button class="back" onclick="page('deposit')">← Back</button><div class="card"><h2>🧾 Transaction ID</h2><p class="muted">After sending the payment, enter your transaction hash below.</p><input id="txid" placeholder="Transaction ID / Hash"><button class="btn" onclick="submitTx()">Confirm Deposit</button><div class="notice">Please wait a few minutes for us to verify your transaction and add the balance to your account.</div></div></div>

<div id="withdraw" class="page"><button class="back" onclick="page('home')">← Back</button>
<div class="card">
<h2>💸 Withdraw</h2>
<div class="notice">Minimum withdrawal: <b>$1.00</b><br>Your withdrawal amount is deducted from your available balance immediately and remains <b>Pending</b> until reviewed/processed.</div>

<label>Withdrawal Method</label>
<div class="withdraw-methods">
<button type="button" class="withdraw-method active" id="wm-ton" onclick="selectWithdrawMethod('ton')">🔵 <b>TON</b><span class="muted">TON Network</span></button>
<button type="button" class="withdraw-method" id="wm-tron" onclick="selectWithdrawMethod('tron')">🟢 <b>USDT</b><span class="muted">TRON (TRC-20)</span></button>
<button type="button" class="withdraw-method" id="wm-bsc" onclick="selectWithdrawMethod('bsc')">🟡 <b>USDT</b><span class="muted">BNB Smart Chain</span></button>
<button type="button" class="withdraw-method" id="wm-btc" onclick="selectWithdrawMethod('btc')">🟠 <b>Bitcoin</b><span class="muted">BTC Network</span></button>
</div>

<label>Wallet Address</label>
<input id="withdrawAddress" placeholder="Enter your receiving wallet address">

<label>Withdrawal Amount (USD)</label>
<input id="withdrawAmount" type="number" min="1" step="0.01" placeholder="Enter amount">

<div class="withdraw-summary">
<div class="row"><span>Available Balance</span><b id="withdrawAvailable">$0.00</b></div>
<div class="row"><span>Withdrawal Amount</span><b id="withdrawPreview">$0.00</b></div>
<div class="row"><span>After Request</span><b id="withdrawAfter">$0.00</b></div>
<div class="balance-locked">🔒 Once confirmed, the amount is reserved/deducted and shown as Pending in History.</div>
</div>

<button class="btn" onclick="confirmWithdrawal()">Confirm Withdrawal</button>
<div class="withdraw-note">Only submit a wallet address belonging to the selected network. Withdrawal processing is handled by the secure backend/admin system.</div>
</div></div>

<div id="promote"<div id="promote" class="page"><button class="back" onclick="page('home')">← Back</button><div class="card"><h2>📢 Your Channel Promote</h2><label>Platform</label><select><option>▶️ YouTube</option><option>🎵 TikTok</option><option>📘 Facebook</option><option>✈️ Telegram</option></select><label>Campaign Link</label><input placeholder="https://..."><label>Target</label><select><option>100 — $0.30</option><option>1,000 — $1.00</option><option>2,000 — $2.00</option></select><div class="notice">Deposit the required campaign budget before a task goes live. Campaigns must follow each platform's rules and must not use bots or fraudulent engagement.</div><button class="btn" onclick="page('deposit')">Deposit & Create Task</button></div></div>

<div id="wheel" class="page"><button class="back" onclick="page('home')">← Back</button><div class="card"><h2>🎡 Lucky Wheel</h2><div class="notice"><b>Coming Soon</b><br>This feature is under development.</div><p class="muted">$0.001 · $0.002 · $0.05 · $1 · $5 · $10</p></div></div>
<div id="promo" class="page"><button class="back" onclick="page('home')">← Back</button><div class="card"><h2>🎟️ Promo Code</h2><div class="notice"><b>Coming Soon</b><br>Promo codes will be available in a future update.</div></div></div>
<div id="history" class="page"><button class="back" onclick="page('home')">← Back</button><div class="card"><h2>📜 Deposit & Transaction History</h2><div id="hist" class="muted">No transactions yet.</div></div></div>
<div id="profile" class="page"><button class="back" onclick="page('home')">← Back</button>
<div class="card profile-hero">
<img id="profilePhoto" class="profile-photo" alt="Telegram profile photo">
<h2 id="profileName">Telegram User</h2>
<div class="muted" id="profileUsername">@username</div>
<div style="margin-top:10px"><span class="level-badge" id="profileLevel">⭐ Common · Level 1</span></div>
</div>
<div class="card">
<h3>Profile Overview</h3>
<div class="item"><span>Telegram ID</span><b id="profileId">—</b></div>
<div class="item"><span>Balance</span><b id="profileBalance">$0.00</b></div>
<div class="item"><span>Total Referrals</span><b id="profileRefs">0</b></div>
<div class="item"><span>Referral Earnings</span><b>$0.00</b></div>
</div>
<div class="card">
<h3>Referral Level System</h3>
<div class="item"><span>Level 1 · Common</span><b>0+</b></div>
<div class="item"><span>Level 2 · Elite</span><b>3+</b></div>
<div class="item"><span>Level 3 · Pro</span><b>6+</b></div>
<div class="item"><span>Level 4 · Master</span><b>12+</b></div>
<div class="item"><span>Level 5 · Legendary</span><b>15+</b></div>
</div>
</div>
<div class="nav"><button onclick="page('home')"><i>🏠</i>Home</button><button onclick="page('watch')"><i>🎬</i>Ads</button><button onclick="page('ref')"><i>👥</i>Referrals</button><button onclick="page('history')"><i>📜</i>History</button><button onclick="page('profile')"><i>👤</i>Profile</button></div><div id="toast" class="toast"></div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}
const W={ton:"UQD2KsEcAoJc8ksG53JOXM5ZZ0YqLCVCDJ_3VyykrAYOyJGz",btc:"bc1q0cpwxwwz75es7y6970mn7khamzxudvdfp0y3ge",bsc:"YOUR_BSC_USDT_WALLET_ADDRESS",tron:"YOUR_TRON_USDT_WALLET_ADDRESS"};
const N={ton:"TON Network",btc:"Bitcoin Network",bsc:"BNB Smart Chain",tron:"TRON (TRC-20)"};
const AD_REWARD_PER_100 = {
  1: 0.02, // Common
  2: 0.03, // Elite
  3: 0.04, // Pro
  4: 0.05, // Master
  5: 0.07  // Legendary
};
const REFERRAL_LEVELS = [
  {level:1,name:"Common",min:0},
  {level:2,name:"Elite",min:3},
  {level:3,name:"Pro",min:6},
  {level:4,name:"Master",min:12},
  {level:5,name:"Legendary",min:15}
];
function getReferralLevel(referrals){
  let current=REFERRAL_LEVELS[0];
  for(const x of REFERRAL_LEVELS){ if(referrals>=x.min) current=x; }
  return current;
}
function getAdRewardPer100(referrals){
  return AD_REWARD_PER_100[getReferralLevel(referrals).level];
}
function updateAdRewardUI(referrals){
  const lvl=getReferralLevel(referrals);
  const rate=getAdRewardPer100(referrals);
  const txt="$"+rate.toFixed(2)+" per 100 ads";
  const el=document.getElementById("watchRate");
  if(el) el.textContent=txt;
  const badge=document.getElementById("levelBadge");
  if(badge) badge.textContent="⭐ "+lvl.name+" · Level "+lvl.level;
  const p=document.getElementById("profileLevel");
  if(p) p.textContent="⭐ "+lvl.name+" · Level "+lvl.level;
}

function getAdsNexaBalance(){
  return +(localStorage.getItem("adsnexa_balance")||"0");
}
function setAdsNexaBalance(v){
  localStorage.setItem("adsnexa_balance",Math.max(0,+v).toFixed(2));
}
function getWithdrawMethod(){
  return localStorage.getItem("adsnexa_withdraw_method")||"ton";
}
function selectWithdrawMethod(method){
  localStorage.setItem("adsnexa_withdraw_method",method);
  document.querySelectorAll(".withdraw-method").forEach(x=>x.classList.remove("active"));
  document.getElementById("wm-"+method)?.classList.add("active");
}
function updateWithdrawPreview(){
  const bal=getAdsNexaBalance(), amt=+(document.getElementById("withdrawAmount")?.value||0);
  const av=document.getElementById("withdrawAvailable"), pv=document.getElementById("withdrawPreview"), af=document.getElementById("withdrawAfter");
  if(av)av.textContent="$"+bal.toFixed(2);
  if(pv)pv.textContent="$"+amt.toFixed(2);
  if(af)af.textContent="$"+Math.max(0,bal-amt).toFixed(2);
}
function confirmWithdrawal(){
  const address=(document.getElementById("withdrawAddress")?.value||"").trim();
  const amount=+(document.getElementById("withdrawAmount")?.value||0);
  const balance=getAdsNexaBalance();
  const method=getWithdrawMethod();
  if(!address){toast("Please enter your withdrawal wallet address.");return}
  if(amount<1){toast("Minimum withdrawal is $1.00.");return}
  if(amount>balance){toast("Insufficient available balance.");return}

  // Client demo state: reserve/deduct immediately and create a Pending history record.
  // In production, this MUST be performed atomically by the secure backend.
  setAdsNexaBalance(balance-amount);
  const h=JSON.parse(localStorage.getItem("adsnexa_history")||"[]");
  h.push({
    type:"withdrawal",
    amount:amount,
    method:N[method],
    address:address,
    status:"Pending",
    date:new Date().toLocaleString()
  });
  localStorage.setItem("adsnexa_history",JSON.stringify(h));
  updateWithdrawPreview();
  render();
  toast("$"+amount.toFixed(2)+" withdrawal submitted. Status: Pending.");
  setTimeout(()=>page("history"),600);
}

function refreshWithdrawPage(){
  const method=getWithdrawMethod();
  selectWithdrawMethod(method);
  const input=document.getElementById("withdrawAmount");
  if(input && !input.dataset.bound){input.addEventListener("input",updateWithdrawPreview);input.dataset.bound="1";}
  updateWithdrawPreview();
}
function profile(){
  const u=tg?.initDataUnsafe?.user;
  const name=u?.first_name||u?.username||"Telegram User";
  const el=(id)=>document.getElementById(id);
  if(el("profileName")) el("profileName").textContent=name;
  if(el("profileUsername")) el("profileUsername").textContent=u?.username?"@"+u.username:"No public username";
  if(el("profileId")) el("profileId").textContent=u?.id||"—";
  if(el("profileBalance")) el("profileBalance").textContent="$"+getAdsNexaBalance().toFixed(2);
  if(el("rl")) el("rl").value="https://t.me/AdsNexa_EarnBot?start="+(u?.id||"USER_ID");
  const photo=el("profilePhoto");
  if(photo){if(u?.photo_url){photo.src=u.photo_url;photo.style.display="block";const av=el("avatar");if(av)av.innerHTML='<img src="'+u.photo_url+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">';}else photo.style.display="none";}
  const refs=getReferralCount();
  if(el("profileRefs")) el("profileRefs").textContent=refs;
  updateEnhancedLevelUI(refs,false);
}
function updateReferralUI(referrals){
  const count=Number(referrals||0);
  const el=(id)=>document.getElementById(id);
  if(el("refs")) el("refs").textContent=count;
  if(el("refTotal")) el("refTotal").textContent=count;
  if(el("refActive")) el("refActive").textContent=count;
  const lvl=getReferralLevel(count);
  const next=REFERRAL_LEVELS.find(x=>x.min>count);
  if(el("levelText")) el("levelText").textContent=next?`${count} / ${next.min} referrals to reach ${next.name}`:`Level ${lvl.level} maximum unlocked`;
  if(el("levelProgress")){const base=REFERRAL_LEVELS[lvl.level-1]?.min||0;const pct=next?Math.min(100,Math.max(0,(count-base)/Math.max(1,next.min-base)*100)):100;el("levelProgress").style.width=pct+"%";}
  updateAdRewardUI(count);
}
function renderReferralList(){
  const el=document.getElementById("refList");
  if(el && !el.innerHTML.trim()) el.innerHTML='<div class="muted">No referrals yet.</div>';
}

function page(id){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");if(id=="deposit")wallet();if(id=="profile")profile();scrollTo(0,0)}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",2600)}
function amt(x){amount.value=x}
function wallet(){const k=document.getElementById('net')?.value||'ton';const out=document.getElementById('w');if(!out)return;out.innerHTML=`<div class="notice">💳 <b>${N[k]}</b></div><div class="wallet">${W[k]}</div><button class="btn alt" onclick="navigator.clipboard?.writeText(W[document.getElementById('net').value]);toast('Wallet address copied.')">Copy Address</button>`}
function tx(){let a=+amount.value;if(a<1||a>100){toast("Deposit must be between $1 and $100.");return}page("tx")}
function submitTx(){if(!txid.value.trim()){toast("Please enter the Transaction ID / Hash.");return}let h=JSON.parse(localStorage.getItem("adsnexa_history")||"[]");h.push({amount:+amount.value,method:N[net.value],tx:txid.value.trim(),status:"Pending Verification",date:new Date().toLocaleString()});localStorage.setItem("adsnexa_history",JSON.stringify(h));render();toast("Deposit submitted. Please wait a few minutes for verification.");setTimeout(()=>page("history"),500)}
function render(){
 let h=JSON.parse(localStorage.getItem("adsnexa_history")||"[]");
 document.getElementById("hist").innerHTML=h.length?h.slice().reverse().map(x=>{
   if(x.type==="withdrawal"){
     let cls=x.status==="Approved"?"status-approved":x.status==="Rejected"?"status-rejected":"status-pending";
     return '<div class="item"><span><b>💸 Withdrawal · $'+Number(x.amount).toFixed(2)+'</b><br><span class="muted">'+x.method+' · '+x.date+'</span><br><span class="muted">'+String(x.address).slice(0,12)+'…'+String(x.address).slice(-8)+'</span></span><span class="'+cls+'">'+x.status+'</span></div>';
   }
   return '<div class="item"><span><b>💰 Deposit · $'+Number(x.amount).toFixed(2)+'</b><br><span class="muted">'+x.method+' · '+x.date+'</span></span><span class="status-pending">'+(x.status||"Pending Verification")+'</span></div>';
 }).join(""):"No transactions yet."
}
render();profile();wallet();refreshWithdrawPage();updateReferralUI(0);renderReferralList();
updateReferralUI(0);
</script></body></html>
